services:
  traefik:
    image: traefik:v3.3
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${DASHBOARD_PORT:-8889}:8080"
    volumes:
      - ./traefik:/etc/traefik:ro
      - letsencrypt:/letsencrypt
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/luca-guettinger/user-mgmt-backend:${IMAGE_TAG:-latest}
    env_file: .env
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    image: ghcr.io/luca-guettinger/auth-portal:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      - backend

networks:
  backend:

volumes:
  pgdata:
  letsencrypt:
