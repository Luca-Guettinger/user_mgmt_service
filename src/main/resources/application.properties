spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Reject a body carrying fields the DTO does not have, instead of silently
# dropping them. The portal already sends exactly the DTO's four fields.
spring.jackson.deserialization.fail-on-unknown-properties=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Actuator: health for the probes, prometheus for the ServiceMonitor.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=user-mgmt-service
# Histogram buckets so Grafana can compute p95/p99. Bounded on purpose - the
# JVM runs with -Xmx256m and unbounded buckets are a cardinality trap.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s

# Probe groups: liveness = livenessState, readiness = readinessState. Neither
# includes the database, so a lost DB shows up as 5xx and an alert instead of
# pods going NotReady or being restarted while they are merely busy.
management.endpoint.health.probes.enabled=true

# ----------------------------------------------------------------- module service
# Where the module service answers. MODULE_SERVICE_URL comes from the backend
# ConfigMap, which the Helm chart renders from the module service's Service name,
# so the call can only ever leave through the cluster's own DNS.
modules.base-url=${MODULE_SERVICE_URL}
modules.connect-timeout=1s
modules.read-timeout=2s

# Retry: a handful of fast attempts for the failures that are worth repeating -
# a refused connection, a timeout, a 5xx. A 404 is an answer and is not listed.
resilience4j.retry.instances.moduleService.max-attempts=3
resilience4j.retry.instances.moduleService.wait-duration=200ms
resilience4j.retry.instances.moduleService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Circuit breaker: after five calls, half of them failing opens it for 30s, so a
# module service that is down costs one fast 503 instead of three timeouts each time.
resilience4j.circuitbreaker.instances.moduleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.moduleService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.moduleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.moduleService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.moduleService.permitted-number-of-calls-in-half-open-state=3
# Same list as the retry: only real outages may open the breaker.
resilience4j.circuitbreaker.instances.moduleService.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
# Off on purpose. An open breaker must not turn /actuator/health red: the readiness
# probe and the pipeline's verify job read it, and a downstream outage is an alert,
# not a reason to take production pods out of service.
resilience4j.circuitbreaker.instances.moduleService.register-health-indicator=false
