spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Actuator: health for the probes, prometheus for the ServiceMonitor.
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=user-mgmt-service
# Histogram buckets so Grafana can compute p95/p99. Bounded on purpose - the
# JVM runs with -Xmx256m and unbounded buckets are a cardinality trap.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=10ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s
