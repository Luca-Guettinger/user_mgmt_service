name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: .
            image: user-mgmt-backend
            build-args: ""
          - name: portal
            context: ./auth_portal-main
            image: auth-portal
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The cluster is not deployed to from here. ArgoCD in the DigitalOcean cluster
  # watches user_mgmt_gitops and applies whatever that repo says. So "deploying"
  # from this repo means one thing: committing the tag of the images we just
  # built into that repo, and letting ArgoCD do the rest.
  bump:
    name: Point GitOps at this commit
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Nothing here uses the automatic token; the push below uses GITOPS_PAT.
    permissions: {}
    steps:
      - name: Check out the ops repo
        uses: actions/checkout@v4
        with:
          repository: Luca-Guettinger/user_mgmt_gitops
          ref: main
          # Fine-grained PAT, Contents: Read and write, scoped to that repo only.
          token: ${{ secrets.GITOPS_PAT }}

      - name: Set the production image tag
        env:
          NEW_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          f=charts/user-mgmt/values-prod.yaml

          # global.imageTag is the only key at this indentation in that file.
          sed -i -E "s|^([[:space:]]{2}imageTag:).*|\1 ${NEW_TAG}|" "$f"

          # If the key is ever renamed or re-indented the sed above silently does
          # nothing, which would give a green deploy that shipped no code. Fail here
          # instead.
          grep -qx "  imageTag: ${NEW_TAG}" "$f"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already pointing at ${GITHUB_SHA}, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy user_mgmt_service@${GITHUB_SHA}"
          git push

  verify:
    name: Verify rollout
    needs: bump
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Wait for ArgoCD to sync and the app to answer
        env:
          # https://vsc.notenverwaltung.ch/backend
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -uo pipefail
          site="${API_URL%/backend}"

          # ArgoCD polls Git roughly every 3 minutes, so the new revision is not
          # live the moment the commit above lands. Allow 10 minutes.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 -o /dev/null "${API_URL}/actuator/health" \
               && curl -fsS --max-time 10 -o /dev/null "${site}/"; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Not ready yet (${i}/40), retrying in 15s."
            sleep 15
          done

          echo "::error::Site did not become healthy within 10 minutes."
          exit 1
